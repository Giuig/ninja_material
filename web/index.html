<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ninja_material">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ninja_material</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shared loading screen. In <head> and NOT async on purpose: a head
       script blocks first paint, so the first paint already carries the right
       background instead of flashing white and being corrected a frame later.

       NOTE THE PATH. This is the package building ITSELF, so its own assets
       land at `assets/assets/...`. A consuming app gets the same file at
       `assets/packages/ninja_material/assets/web/ninja_loader.js` instead --
       copying this line verbatim into an app will 404. The app-side snippet
       is documented at the top of ninja_loader.js.

       No data-prefix here: the example app does not call
       SharedPreferences.setPrefix, so it keeps the default `flutter.`. -->
  <script src="assets/assets/web/ninja_loader.js"
          data-bg-light="#faf9fd" data-bg-dark="#131316"
          data-accent-light="#4a5c92" data-accent-dark="#b3c5ff"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
