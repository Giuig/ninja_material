name: CI

# This package's own trigger. The checks themselves live in the shared
# app-ci.yml alongside build-app.yml / version-bump.yml / web-deploy.yml, so the
# fleet has exactly one definition of "is this green" rather than one per repo.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    uses: ./.github/workflows/app-ci.yml
    with:
      app-name: ninja_material
      # This is a package, not an app: no web entrypoint of its own, so there is
      # nothing for `flutter build web` to compile. The example is exercised by
      # the package's own tests instead.
      build-web: false
