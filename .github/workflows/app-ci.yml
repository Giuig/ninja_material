name: Ninja App CI

# Shared pull-request gate for every ninja app, called from a thin shim in each
# repo — the same pattern as build-app.yml / version-bump.yml / web-deploy.yml.
#
# Naming follows the convention already in this folder: a hyphen means "shared,
# workflow_call"; an underscore (version_bump.yml) means "this repo's own
# trigger". Do not add a `pull_request` trigger here — the callers own that.
#
# Why this exists: none of the apps had any check on a pull request. The other
# three shared workflows are all release machinery that fires on tags, a version
# change or a dispatch, so the only gate on a regression reaching main was a
# human reading the diff.
on:
  workflow_call:
    inputs:
      app-name:
        description: 'App name, used only to label the run'
        required: true
        type: string
      flutter-version:
        description: >
          Flutter SDK version. Defaults to the fleet toolchain so every app is
          checked against the same SDK the owner develops on, and so a run is
          reproducible months later. Pass a different value to trial an upgrade
          in one app without moving the others.
        required: false
        type: string
        default: '3.41.5'
      analyze-paths:
        description: >
          Paths given to `flutter analyze`. Deliberately scoped rather than
          whole-tree: auraninja vendors third_party/flutter_soloud, whose own
          example and test directories produce ~124 errors that are not the
          app's code and are not excluded by analysis_options.yaml.
        required: false
        type: string
        default: 'lib test'
      fatal-infos:
        description: >
          Also fail on analyzer infos. Off by default, and that is deliberate:
          every app carries pre-existing infos (30 in tvninja, 60 in auraninja),
          so switching this on would make the check red on day one and teach
          everyone to ignore it. Errors and warnings are ALWAYS fatal. Turn this
          on per-app once that app reaches zero infos.
        required: false
        type: boolean
        default: false
      run-tests:
        description: 'Run `flutter test`.'
        required: false
        type: boolean
        default: true
      build-web:
        description: >
          Compile the web target. On by default because web-only files
          (conditional imports) are compiled by no other target, so without it
          web breakage stays invisible until a release — and these apps do ship
          web builds via web-deploy.yml. Turn off for a package with no web
          entrypoint.
        required: false
        type: boolean
        default: true
      check-icons:
        description: >
          Verify the app's icon set (the `icons` job below). Off by default: an
          app turns it on once it has an icon_config.yml and its launcher icons
          are generated by flutter_launcher_icons from pubspec.yaml.
        required: false
        type: boolean
        default: false
      ninja-material-ref:
        description: >
          Which ninja_material ref supplies scripts/generate_icons.py for the
          icon check. Defaults to main, matching the @main the shims pin.
        required: false
        type: string
        default: 'main'

jobs:
  analyze-and-test:
    name: ${{ inputs.app-name }} — analyze, test, web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze ${{ inputs.analyze-paths }} ${{ inputs.fatal-infos && '--fatal-infos' || '--no-fatal-infos' }}

      - name: Test
        if: inputs.run-tests
        run: flutter test

      - name: Build web
        if: inputs.build-web
        # --no-tree-shake-icons because that is what this fleet actually ships:
        # web-deploy.yml and build-app.yml both pass it. Without it this gate is
        # STRICTER than every release path and fails on code that ships fine.
        # decisioninja is the case that proved it — lib/pages/ninja_page.dart
        # rebuilds IconData from a stored codePoint so a user's chosen icon can
        # survive a restart, and the icon tree-shaker rejects any non-constant
        # IconData outright. That is not fixable without dropping the feature,
        # which is presumably why both release workflows already disable it.
        run: flutter build web --no-tree-shake-icons

  # Icons drifted silently before this existed: the committed adaptive icon used a
  # 25% inset while pubspec.yaml's flutter_launcher_icons config produced 16%, so
  # simply re-running the tool would have shrunk the icon and dropped the themed
  # (monochrome) layer. Two checks, both deterministic:
  #   1. the single-colour outputs of generate_icons.py (SVG, monochrome PNG,
  #      notification vector) agree with each other and with the pubspec config;
  #   2. re-running flutter_launcher_icons changes nothing beyond PNG rounding,
  #      i.e. every committed launcher icon really comes from the config. Re-runs
  #      on one machine were byte-identical; across OSes a pixel may round by
  #      1/255, which is tolerated and nothing more.
  # The tracer itself is NOT re-run here: its float maths depends on numpy/Pillow
  # versions, so a re-trace could differ in the last digit and fail for nothing.
  icons:
    name: ${{ inputs.app-name }} — icons
    if: inputs.check-icons
    runs-on: ubuntu-latest
    steps:
      # Side by side, like readme-sync.yml, so the script's --repo resolves the
      # app next to ninja_material exactly as on a developer machine.
      - uses: actions/checkout@v4
        with:
          path: ${{ inputs.app-name }}

      - uses: actions/checkout@v4
        with:
          repository: Giuig/ninja_material
          ref: ${{ inputs.ninja-material-ref }}
          path: ninja_material

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install numpy pillow pyyaml

      - name: Icon outputs agree with each other and the config
        run: python ninja_material/scripts/generate_icons.py --repo ${{ inputs.app-name }} --check

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
          cache: true

      - name: flutter_launcher_icons reproduces the committed icons
        working-directory: ${{ inputs.app-name }}
        run: |
          # --enforce-lockfile: a lockfile rewrite would otherwise show up below
          # as a false "icon drift".
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Tolerates PNG rounding only (<= 1/255 per channel): the resampler is
          # not guaranteed to round identically on every OS. Any other change
          # fails and is listed.
          python ../ninja_material/scripts/generate_icons.py --app-dir . --check-regenerated

# No `dart format --set-exit-if-changed` step: no app in the fleet is
# formatter-clean, so it would fail every PR everywhere from the first run. That
# wants a per-app formatting pass first, then this can grow a `fatal-format`
# input the same way `fatal-infos` works.
